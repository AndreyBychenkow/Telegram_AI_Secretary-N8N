name: Renew PythonAnywhere web app

on:
  schedule:
    - cron: "17 4 */5 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renew-pythonanywhere
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.32,<3"

      - name: Extend web app expiry
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
        run: python deploy/renew_pythonanywhere.py

      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep schedule alive
        run: |
          last_commit=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last_commit )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898382+github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/renew-heartbeat
            git add .github/renew-heartbeat
            git commit -m "chore: keep renew workflow alive"
            git push
          fi
