name: Restore PythonAnywhere access v2

# Диагностика смены пароля на PythonAnywhere.
# Входит паролем из PA_PASSWORD, подробно показывает форму смены пароля, пробует сменить
# на значение из NEW_PA_PASSWORD и печатает ТЕКСТ ошибки, если PA отклонил смену.
# Пароли в отчёт не попадают; адреса почты маскируются.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PA_USERNAME: ${{ secrets.PA_USERNAME }}
      PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
      NEW_PA_PASSWORD: ${{ secrets.NEW_PA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "requests>=2.32,<3"

      - name: Diagnose and change
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          import requests

          TIMEOUT = 30
          CSRF = "csrfmiddlewaretoken"
          REPORT = "pa-restore-report.txt"
          EXPIRY_RE = re.compile(
              r'class="[^"]*webapp_expiry[^"]*"[^>]*>.*?<strong>\s*([^<]+?)\s*</strong>', re.S
          )
          EMAIL_RE = re.compile(r"[\w.+-]+@[\w-]+(?:\.[\w-]+)+")
          KEYWORDS = (
              "error", "invalid", "incorrect", "wrong", "too short", "too long", "common",
              "weak", "must", "cannot", "can't", "changed", "success", "неверн", "нельзя",
              "должен", "слаб", "измен",
          )

          report_lines = []


          def rec(text=""):
              print(text)
              report_lines.append(text)


          def write_report():
              stamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
              with open(REPORT, "w", encoding="utf-8") as handle:
                  handle.write("# Отчёт (диагностика смены пароля)\n\nСформирован: " + stamp + "\n\n```\n")
                  handle.write("\n".join(report_lines) + "\n```\n")


          def base_url():
              host = os.environ.get("PA_HOST", "").strip() or "www.pythonanywhere.com"
              return host if "://" in host else "https://" + host


          def mask_email(value):
              local, _, domain = value.partition("@")
              if not domain:
                  return value[:1] + "***"
              return "%s***@%s***%s" % (local[:1], domain[:1], domain[domain.rfind("."):])


          def scrub(text):
              return EMAIL_RE.sub(lambda match: mask_email(match.group(0)), text)


          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  attributes = {key: value or "" for key, value in attrs}
                  if tag == "form":
                      self.current = {
                          "action": attributes.get("action", ""),
                          "method": (attributes.get("method", "get") or "get").lower(),
                          "enctype": attributes.get("enctype", ""),
                          "fields": [],
                      }
                      self.forms.append(self.current)
                  elif tag in ("input", "textarea", "select") and self.current is not None:
                      name = attributes.get("name")
                      if name:
                          self.current["fields"].append(
                              {
                                  "name": name,
                                  "type": attributes.get("type", "text").lower(),
                                  "value": attributes.get("value", ""),
                              }
                          )

              def handle_endtag(self, tag):
                  if tag == "form":
                      self.current = None


          def parse_forms(html):
              parser = FormParser()
              parser.feed(html)
              return parser.forms


          def field_names(form):
              return [field["name"] for field in form["fields"]]


          def login(session, base, username, password):
              login_url = base + "/login/"
              page = session.get(login_url, timeout=TIMEOUT)
              page.raise_for_status()
              form = next((f for f in parse_forms(page.text) if "auth-username" in field_names(f)), None)
              if form is None:
                  raise RuntimeError("форма входа не найдена")
              data = {"login_view-current_step": "auth", "auth-username": username, "auth-password": password}
              for field in form["fields"]:
                  if field["name"] == CSRF:
                      data[CSRF] = field["value"]
              response = session.post(login_url, data=data, headers={"Referer": login_url}, timeout=TIMEOUT)
              response.raise_for_status()
              for form in parse_forms(response.text):
                  for field in form["fields"]:
                      if field["name"] == "login_view-current_step" and field["value"] == "token":
                          raise RuntimeError("включена двухфакторная авторизация")
              return "/login" not in response.url and "log out" in response.text.lower()


          def plain_text(html):
              text = re.sub(r"<script.*?</script>", " ", html, flags=re.S | re.I)
              text = re.sub(r"<style.*?</style>", " ", text, flags=re.S | re.I)
              text = re.sub(r"<[^>]+>", "\n", text)
              text = re.sub(r"&nbsp;?", " ", text)
              text = re.sub(r"&amp;", "&", text)
              text = re.sub(r"\n{2,}", "\n", text)
              return scrub(text.strip())


          def relevant_lines(html, limit=12):
              out = []
              for line in plain_text(html).split("\n"):
                  line = line.strip()
                  if not line or len(line) > 300:
                      continue
                  low = line.lower()
                  if any(key in low for key in KEYWORDS) or "pass" in low:
                      if line not in out:
                          out.append(line)
              return out[:limit]


          def try_change(session, base, username, form, action, new_password):
              names = field_names(form)
              old_like = ("old", "current", "existing")
              new_fields = [
                  name for name in names
                  if name != CSRF and "pass" in name.lower()
                  and not any(needle in name.lower() for needle in old_like)
              ]
              old_fields = [
                  name for name in names if name != CSRF and any(needle in name.lower() for needle in old_like)
              ]
              rec("  поля, которые считали старым паролем: %s" % old_fields)
              rec("  поля, которые считали новым паролем: %s" % new_fields)

              data = {}
              for field in form["fields"]:
                  name = field["name"]
                  if name == CSRF:
                      data[CSRF] = field["value"]
                  elif name in new_fields:
                      data[name] = new_password
                  elif name in old_fields:
                      data[name] = os.environ.get("PA_PASSWORD", "")
                  else:
                      data[name] = field["value"]

              response = session.post(action, data=data, headers={"Referer": base + "/user/%s/account/" % username},
                                      timeout=TIMEOUT, allow_redirects=False)
              rec("  ответ на попытку смены: HTTP %s, Location: %s" % (
                  response.status_code, response.headers.get("Location", "(нет)")))

              if response.status_code in (301, 302, 303):
                  follow = session.get(urljoin(base, response.headers.get("Location", "/")), timeout=TIMEOUT)
                  rec("  после переадресации: HTTP %s, адрес %s" % (follow.status_code, follow.url.replace(base, "")))
                  rec("  текст страницы: %s" % (relevant_lines(follow.text) or ["(ничего похожего на сообщение)"]))
              else:
                  rec("  текст страницы: %s" % (relevant_lines(response.text) or ["(ничего похожего на сообщение)"]))

              with requests.Session() as check:
                  check.headers["User-Agent"] = "pa-restore/2.1"
                  if login(check, base, username, new_password):
                      return True
                  return False


          def main():
              base = base_url()
              username = os.environ.get("PA_USERNAME", "").strip()
              old_password = os.environ.get("PA_PASSWORD", "")
              raw_new = os.environ.get("NEW_PA_PASSWORD", "")
              rec("Логин: " + username)
              session = requests.Session()
              session.headers["User-Agent"] = "pa-restore/2.1"
              if not login(session, base, username, old_password):
                  rec("ОШИБКА: вход старым паролем не удался")
                  return 3
              rec("Вход старым паролем: успешно")

              account_url = base + "/user/%s/account/" % username
              page = session.get(account_url, timeout=TIMEOUT)
              rec("")
              rec("## Формы на странице аккаунта (%s -> HTTP %s)" % (account_url.replace(base, ""), page.status_code))
              forms = parse_forms(page.text)
              password_form = None
              for index, form in enumerate(forms, 1):
                  names = field_names(form)
                  rec("  форма %d: action=%r method=%s поля=%s" % (
                      index, form["action"], form["method"],
                      [(f["name"], f["type"]) for f in form["fields"]]))
                  if sum("pass" in name.lower() for name in names) >= 2:
                      password_form = form
              if password_form is None:
                  rec("ОШИБКА: форма смены пароля не найдена")
                  return 4
              raw_action = password_form["action"].strip()
              # action="." (как у PythonAnywhere) означает «та же страница», а urljoin сделал бы
              # из него родительский каталог — запрос ушёл бы не туда.
              action = account_url if raw_action in ("", ".", "./") else urljoin(account_url, raw_action)
              rec("  форма смены пароля: action=%r -> отправляем на %s" % (raw_action, action))

              rec("")
              rec("## Попытка смены пароля")
              raw_lines = [line.strip() for line in raw_new.replace("\r", "\n").split("\n") if line.strip()]
              candidates = [v for v in raw_lines if 8 <= len(v) <= 64 and all(ord(ch) < 128 for ch in v)]
              rec("  кандидатов: %d (длины: %s)" % (len(candidates), [len(c) for c in candidates]))
              if not candidates:
                  rec("ОШИБКА: в секрете NEW_PA_PASSWORD нет подходящего значения")
                  return 5

              for index, candidate in enumerate(candidates, 1):
                  rec("  --- попытка %d (длина %d) ---" % (index, len(candidate)))
                  if try_change(session, base, username, password_form, action, candidate):
                      rec("РЕЗУЛЬТАТ: пароль изменён и проверен входом. Значение №%d из файла." % index)
                      return 0
                  rec("  вход новым паролем: не удалось")

              rec("")
              rec("РЕЗУЛЬТАТ: смена пароля не удалась, пароль не изменён.")
              return 1


          code = 0
          try:
              code = main()
          except Exception as exc:  # noqa: BLE001
              rec("")
              rec("ИСКЛЮЧЕНИЕ: %s: %s" % (type(exc).__name__, scrub(str(exc))))
              code = 9
          finally:
              write_report()
          sys.exit(code)
          PY

      - name: Publish report
        if: always()
        run: |
          if [ -f pa-restore-report.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898382+github-actions[bot]@users.noreply.github.com"
            git add pa-restore-report.txt
            git commit -m "chore: pa restore report v2" || exit 0
            git pull --rebase || true
            git push
          fi
